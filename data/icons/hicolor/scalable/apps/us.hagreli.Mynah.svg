<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e5c64"/>
      <stop offset="1" stop-color="#241f31"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbe6f"/>
      <stop offset="1" stop-color="#e66100"/>
    </linearGradient>
  </defs>

  <!-- Head. The mynah is a talking bird, which is the whole of the name. -->
  <path fill="url(#body)"
        d="M62 20c19 0 34 14 34 33 0 12-6 22-15 28l4 20a4 4 0 0 1-5 5l-24-8c-18-2-32-16-32-34 0-23 17-44 38-44z"/>

  <!-- Crest, so the silhouette reads as a bird rather than a blob. -->
  <path fill="url(#body)"
        d="M58 20c-4-7-3-13 3-17 1 7 4 11 9 13z"/>

  <!-- Beak, open, because it is saying something. -->
  <path fill="url(#beak)" d="M96 46l24 6-24 8z"/>
  <path fill="#c64600" opacity="0.55" d="M96 53l24-1-24 8z"/>

  <!-- Eye -->
  <circle cx="80" cy="44" r="6" fill="#f6f5f4"/>
  <circle cx="81.5" cy="44.5" r="3" fill="#241f31"/>

  <!-- What it just said. -->
  <g fill="none" stroke="#62a0ea" stroke-linecap="round" stroke-width="7">
    <path d="M22 58v12" opacity="0.95"/>
    <path d="M8 60v8" opacity="0.6"/>
  </g>
  <g fill="none" stroke="#62a0ea" stroke-linecap="round" stroke-width="7" opacity="0.9">
    <path d="M40 96v14"/>
    <path d="M56 92v22"/>
    <path d="M72 98v16"/>
    <path d="M88 102v8"/>
  </g>
</svg>
